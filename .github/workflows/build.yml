name: Build
on: [push, pull_request]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Prepare
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '5.12.x'
      - uses: gittools/actions/gitversion/execute@v0.10.2
        id: gitversion

      # Build
      - name: Build
        run: .\build.ps1 ${{steps.gitversion.outputs.nuGetVersion}}${{github.ref_type != 'tag' && format('-{0}', steps.gitversion.outputs.shortSha) || ''}}

      # Release
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1

      # Publish
      - name: Publish packages (GitHub)
        if: github.event_name == 'push'
        run: dotnet nuget push artifacts\Release\*.nupkg --source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --api-key ${{github.token}} --no-symbols --skip-duplicate
      - uses: NuGet/login@v1
        if: github.ref_type == 'tag'
        id: nuget_login
        with:
          user: ${{secrets.NUGET_USER}}
      - name: Publish packages (NuGet.org)
        if: github.ref_type == 'tag'
        run: dotnet nuget push artifacts\Release\*.nupkg --source nuget.org --api-key ${{steps.nuget_login.outputs.NUGET_API_KEY}}
